<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Money Graph</title>
<style>
/* ------------------------------------------------------------------ *
 * Two schemes, both from tokens. "paper" is the default: a case file
 * reads on paper, and an analyst works in daylight. "dark" is the
 * HackAlem stage scheme for a projector. Every colour the canvases use
 * is read from these tokens at draw time, so the switch is one attribute.
 * No green anywhere: green belongs to Astana Hub, not to HackAlem.
 * ------------------------------------------------------------------ */
:root{
  --bg:#F6F3EC; --panel:#FFFDF8; --sunk:#EFEBE1; --line:#D9D2C3; --line-soft:#E8E2D5;
  --fg:#17150F; --muted:#6B6558; --primary:#0B5FA5; --secondary:#1E3A5F; --amber:#C2410C;
  --display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --consolidator:#B42318; --coordinator:#6D28D9; --transit:#0B5FA5; --distributor:#1D7A9C;
  --terminal:#7A7466; --peripheral:#A8A093;
  --abstained_boundary:#8B7BB8; --abstained_single_observation:#B3A9CC;
  --steel:#9A937F;

  --grid:rgba(11,95,165,.14); --grid-label:#7A7466;
  --edge:rgba(23,21,15,.18); --edge-dim:rgba(23,21,15,.05); --edge-on:rgba(11,95,165,.9);
  --arrow:rgba(11,95,165,.95); --ring:#17150F; --row-hover:rgba(11,95,165,.07);
  --dot-edge:rgba(23,21,15,.25);
  --rail:13.5rem; --top:3.6rem;
}
:root[data-theme=dark]{
  --bg:#060B16; --panel:#0B1524; --sunk:#050912; --line:#16243A; --line-soft:#0F1B2C;
  --fg:#EEF3FB; --muted:#8FA3BF; --primary:#00C8FF; --secondary:#009AF0; --amber:#FFB020;
  --consolidator:#FF5C6C; --coordinator:#C77DFF; --transit:#00C8FF; --distributor:#009AF0;
  --terminal:#7A8AA8; --peripheral:#4A5B75; --abstained_boundary:#6B5FA6; --abstained_single_observation:#443C6E;
  --steel:#5A6B87;
  --grid:rgba(0,200,255,.10); --grid-label:#7C90AD;
  --edge:rgba(122,138,168,.22); --edge-dim:rgba(122,138,168,.06); --edge-on:rgba(0,200,255,.85);
  --arrow:rgba(0,200,255,.90); --ring:#EEF3FB; --row-hover:rgba(0,200,255,.07); --dot-edge:rgba(238,243,251,.28);
}
*{box-sizing:border-box}
html{font-size:16px;scroll-behavior:smooth}
body{margin:0;font:1rem/1.5 var(--body);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ------------------------------ frame ------------------------------ */
.top{position:fixed;top:0;left:0;right:0;height:var(--top);display:flex;align-items:center;gap:1rem;padding:0 1.2rem;
     border-bottom:1px solid var(--line);background:var(--panel);z-index:10}
.mark{font:700 1.2rem/1 var(--display);letter-spacing:-.01em}
.mark i{font-style:normal;color:var(--amber)}
.case{padding-left:1rem;border-left:1px solid var(--line);font-size:.8125rem;color:var(--muted);line-height:1.25}
.find{margin-left:auto;display:flex;align-items:center;gap:.5rem}
.find input{width:19rem;padding:.45rem .7rem;border:1px solid var(--line);border-radius:4px;background:var(--sunk);color:var(--fg);
            font:.9375rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.find input:focus{outline:none;border-color:var(--primary)}
.find input::placeholder{color:var(--steel);font-family:var(--body)}
.lang{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.lang button{padding:.4rem .6rem;font-size:.8rem;font-weight:700;letter-spacing:.06em;color:var(--muted);border-right:1px solid var(--line)}
.lang button:last-child{border-right:0}
.lang button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.theme{padding:.4rem .6rem;border:1px solid var(--line);border-radius:4px;font-size:.8rem;color:var(--muted)}

.rail{position:fixed;top:var(--top);bottom:0;left:0;width:var(--rail);border-right:1px solid var(--line);background:var(--panel);
      padding:1rem 0;overflow:auto}
.rail a{display:grid;grid-template-columns:2.2rem 1fr;align-items:baseline;gap:.4rem;padding:.55rem 1rem .55rem 1.1rem;color:var(--muted);
        border-left:3px solid transparent}
.rail a i{font:700 .8rem/1 var(--mono);font-style:normal;color:var(--steel)}
.rail a span{font-size:.9375rem;font-weight:600;line-height:1.25}
.rail a small{grid-column:2;font-size:.75rem;color:var(--steel);font-weight:400}
.rail a:hover{color:var(--fg)}
.rail a[aria-current=true]{color:var(--fg);border-left-color:var(--amber);background:var(--row-hover)}
.rail a[aria-current=true] i{color:var(--amber)}
.rail .foot{padding:1.2rem 1.1rem 0;font-size:.75rem;color:var(--steel);line-height:1.5}

main{margin:var(--top) 0 0 var(--rail);min-height:calc(100vh - var(--top))}
section.page{display:none;padding:2rem 2.4rem 4rem;max-width:96rem}
section.page[data-on]{display:block}
.ph{display:flex;align-items:baseline;gap:1rem;margin:0 0 .4rem}
.ph i{font:700 .9rem/1 var(--mono);font-style:normal;color:var(--amber);letter-spacing:.06em}
.ph h2{margin:0;font:700 1.9rem/1.15 var(--display);letter-spacing:-.01em}
.lede{color:var(--muted);max-width:70ch;line-height:1.55;margin:0 0 1.6rem;font-size:1rem}
.lede b{color:var(--fg);font-weight:600}
hr.rule{border:0;border-top:1px solid var(--line);margin:1.6rem 0}

/* ------------------------------ ledger figures ------------------------------ */
.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:0;border-top:2px solid var(--fg);border-bottom:1px solid var(--line);margin:0 0 2rem}
.ledger div{padding:1rem 1.2rem 1rem 0;border-right:1px solid var(--line-soft)}
.ledger div:last-child{border-right:0}
.ledger b{display:block;font:700 2.6rem/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ledger .amber b{color:var(--amber)}
.ledger span{display:block;color:var(--muted);font-size:.85rem;margin-top:.35rem;line-height:1.35}

/* ------------------------------ start cards ------------------------------ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
h3.sec{font:650 .78rem/1 var(--body);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:0 0 .8rem}
.lead{display:block;border:1px solid var(--line);border-radius:4px;padding:.9rem 1rem;background:var(--panel);cursor:pointer;border-left:3px solid var(--line)}
.lead:hover{border-color:var(--primary)}
.lead .r{font:700 .75rem/1 var(--mono);color:var(--amber);margin-bottom:.4rem;letter-spacing:.06em}
.lead .g{font:600 1rem/1.2 var(--mono);word-break:break-all}
.lead .w{font-size:.85rem;color:var(--muted);line-height:1.45;margin-top:.4rem}
.lead .t{margin-top:.5rem}
.fact{border-left:3px solid var(--primary);padding:.3rem .9rem;margin:.6rem 0}
.fact b{font:700 1.5rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.fact span{display:block;color:var(--muted);font-size:.875rem;line-height:1.4}
.go{display:inline-block;margin-top:.6rem;color:var(--primary);font-weight:600;font-size:.875rem}
.go:after{content:" →"}

/* ------------------------------ pills, stamps ------------------------------ */
.pill{display:inline-block;padding:.1rem .5rem;border-radius:2px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-family:var(--body);border:1px solid currentColor}
.chip{display:inline-block;margin:.2rem .3rem .2rem 0;padding:.25rem .6rem;border:1px solid var(--line);border-radius:3px;font-size:.8125rem;cursor:pointer;font-family:var(--mono)}
.chip:hover{border-color:var(--primary)}

/* ------------------------------ review table ------------------------------ */
table{border-collapse:collapse;width:100%;font-size:.9375rem}
th,td{text-align:left;padding:.6rem .7rem;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{color:var(--muted);font-weight:650;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;border-bottom:2px solid var(--fg)}
td.wrap{color:var(--muted);line-height:1.45}
tbody tr[data-gid]:hover td,tbody tr[data-frm]:hover td{background:var(--row-hover);cursor:pointer}
td.right,th.right{text-align:right}
.bar{display:inline-block;height:6px;background:var(--primary);vertical-align:middle;margin-right:.5rem}
.rank{font:700 1rem/1 var(--mono);color:var(--muted)}

/* ------------------------------ account / structures layout ------------------------------ */
.explore{display:grid;grid-template-columns:minmax(0,1fr) 25rem;gap:1.4rem;align-items:start}
.mapwrap{border:1px solid var(--line);border-radius:4px;background:var(--panel);overflow:hidden;position:relative}
.mapbar{display:flex;align-items:center;gap:.6rem;padding:.55rem .9rem;border-bottom:1px solid var(--line);background:var(--sunk);flex-wrap:wrap}
.mapbar .what{font-weight:600;font-size:.9rem;flex:1;min-width:12rem}
.mapbar .what span{color:var(--muted);font-weight:400}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:.15rem}
.seg button{padding:.3rem .7rem;font-size:.85rem;font-weight:600;color:var(--muted);border-radius:3px}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
canvas.map{display:block;width:100%;height:34rem;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:.25rem .5rem;padding:.45rem .9rem;border-top:1px solid var(--line);background:var(--sunk);font-size:.8rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:.3rem;cursor:help;padding:.05rem .3rem;border-radius:3px}
.legend span:hover{background:var(--row-hover);color:var(--fg)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;box-shadow:inset 0 0 0 1px var(--dot-edge)}
.mapnote{position:absolute;left:.9rem;bottom:2.6rem;font-size:.8rem;color:var(--muted);pointer-events:none;max-width:28rem;line-height:1.4}
.panel{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:1rem 1.1rem 1.2rem;border-top:3px solid var(--fg)}
.k{color:var(--muted);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;margin:1.1rem 0 .3rem}
.k:first-child{margin-top:0}
.gid{font:600 1.05rem/1.3 var(--mono);word-break:break-all}
.sentence{font-size:.9375rem;line-height:1.55;margin:.3rem 0 0}
.sentence b{font-variant-numeric:tabular-nums}
.ev{background:var(--sunk);border:1px solid var(--line);border-radius:3px;padding:.55rem .7rem;font-size:.85rem;color:var(--muted);line-height:1.45;margin-top:.4rem}
.ev code{color:var(--fg);font-family:var(--mono);font-size:.8rem}
.stat{display:flex;justify-content:space-between;gap:.75rem;font-size:.9rem;padding:.2rem 0;color:var(--muted)}
.stat b{font-variant-numeric:tabular-nums;font-weight:650;color:var(--fg);text-align:right}
.prio{display:flex;align-items:baseline;gap:.6rem}
.prio b{font:700 2.2rem/1 var(--display);color:var(--amber);font-variant-numeric:tabular-nums}
.prio span{font-size:.875rem;color:var(--muted)}
.caveat{border-left:3px solid var(--amber);padding:.4rem .7rem;font-size:.875rem;color:var(--muted);line-height:1.45;margin-top:.6rem;background:var(--sunk)}
.empty{color:var(--muted);font-size:.9rem;line-height:1.5}
.list{max-height:34rem;overflow:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.row{display:grid;grid-template-columns:2.2rem 1fr;gap:.15rem .5rem;padding:.55rem .9rem;border-bottom:1px solid var(--line-soft);cursor:pointer}
.row:hover{background:var(--row-hover)}
.row[aria-selected=true]{background:var(--row-hover);box-shadow:inset 3px 0 0 var(--amber)}
.row .n{font:700 .9rem/1.4 var(--mono);color:var(--muted);text-align:right}
.row .h{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;font-size:.9375rem;font-weight:600}
.row .w{grid-column:2;font-size:.8125rem;color:var(--muted);line-height:1.4}

/* ------------------------------ limits ------------------------------ */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.6rem;margin-bottom:1.6rem}
.tile{border:1px solid var(--line);border-radius:4px;padding:.7rem .8rem;background:var(--panel)}
.tile b{display:block;font:700 1.6rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:.85rem;color:var(--muted);line-height:1.35;margin-top:.2rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(26rem,1fr));gap:1.6rem}
.cols h3{font:700 1.15rem/1.3 var(--display);margin:0 0 .3rem}
.cols .note{color:var(--muted);font-size:.9rem;line-height:1.5;margin:0 0 .6rem;max-width:60ch}
.ask{border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:3px;padding:.55rem .75rem;margin-bottom:.5rem;background:var(--panel)}
.ask .h{font-weight:650;font-size:.9375rem;display:flex;gap:.5rem}
.ask .h i{font-style:normal;color:var(--primary);font-family:var(--mono)}
.ask .w{font-size:.875rem;color:var(--muted);line-height:1.45;margin-top:.25rem}
.ask .f{font-size:.875rem;color:var(--muted);margin-top:.3rem}
.ask .f b{color:var(--fg);font-variant-numeric:tabular-nums}
.module{min-height:20rem}
.boot{padding:3rem;font-size:1rem;color:var(--muted);line-height:1.6}

@media (max-width:1100px){
  :root{--rail:0px}
  .rail{position:static;width:auto;display:flex;overflow-x:auto;padding:0;border-right:0;border-bottom:1px solid var(--line);margin-top:var(--top)}
  .rail a{border-left:0;border-bottom:3px solid transparent;grid-template-columns:auto 1fr;white-space:nowrap}
  .rail a[aria-current=true]{border-bottom-color:var(--amber)}
  .rail a small,.rail .foot{display:none}
  main{margin-top:0}
  .explore,.grid2{grid-template-columns:1fr}
  section.page{padding:1.4rem 1.2rem 3rem}
  .find input{width:11rem}
  .case{display:none}
}

/* ------------------------------ phone ------------------------------
 * Under 640px the top bar wraps: mark, language and theme on the first
 * row, the search input full width on the second. It goes sticky rather
 * than fixed so its height can vary without the rail needing to know.
 * Tables scroll sideways inside their section; nothing else is allowed
 * to widen the page. Everything stays in tokens.
 * ------------------------------------------------------------------ */
@media (max-width:640px){
  html{font-size:15px}
  main{overflow-x:clip}
  .top{position:sticky;height:auto;flex-wrap:wrap;gap:.5rem .6rem;padding:.5rem .8rem}
  .find{display:contents}
  .find input{order:3;flex:1 1 100%;width:100%;min-width:0;font-size:16px;min-height:36px}
  .lang{order:1;margin-left:auto}
  .lang button{min-height:36px;min-width:2.6rem;padding:.4rem .5rem}
  .theme{order:2;min-height:36px;padding:.4rem .6rem}
  .rail{margin-top:0;-webkit-overflow-scrolling:touch}
  .rail a{padding:.6rem .8rem;min-height:36px}
  .rail a span{font-size:.875rem}
  section.page{padding:1rem 1rem 3rem;overflow-x:auto;overflow-y:hidden}
  .ph{gap:.6rem}
  .ph h2{font-size:1.45rem}
  .lede{font-size:.9375rem;margin-bottom:1.1rem}
  table{min-width:36rem;font-size:.875rem}
  th,td{padding:.5rem .5rem}
  .ledger{grid-template-columns:1fr 1fr}
  .ledger div{padding:.8rem .6rem .8rem 0}
  .ledger div:nth-child(2n){border-right:0;padding-left:.6rem}
  .ledger b{font-size:1.9rem}
  .ledger span{font-size:.8rem}
  .grid2{gap:1rem}
  .explore{grid-template-columns:minmax(0,1fr)!important;gap:1rem}
  .panel,.list,.mapwrap{width:100%;min-width:0}
  .list{max-height:18rem}
  canvas.map{height:22rem}
  .mapbar{padding:.5rem .7rem}
  .mapbar .what{min-width:0;flex:1 1 100%;font-size:.85rem}
  .seg button{min-height:36px;padding:.4rem .7rem}
  .chip{min-height:36px;padding:.45rem .6rem}
  .mapnote{max-width:calc(100% - 1.8rem);bottom:3rem}
  .tiles{grid-template-columns:1fr 1fr;gap:.5rem}
  .tile b{font-size:1.35rem}
  .cols{grid-template-columns:minmax(0,1fr);gap:1.2rem}
  .cols>*{min-width:0;overflow-x:auto}
  .prio b{font-size:1.8rem}
  .module{min-height:12rem}
  .boot{padding:1.5rem 1rem}
}
</style>

<div class="top">
  <span class="mark">Money<i>Graph</i></span>
  <div class="case" id="case"></div>
  <div class="find">
    <input id="q" list="ids" autocomplete="off" spellcheck="false" inputmode="numeric"><datalist id="ids"></datalist>
    <div class="lang" id="lang"><button data-l="ru">RU</button><button data-l="kk">KZ</button><button data-l="en">EN</button></div>
    <button class="theme" id="theme"></button>
  </div>
</div>

<nav class="rail" id="rail"></nav>

<main>
  <section class="page" id="p-start"></section>
  <section class="page" id="p-review"></section>
  <section class="page" id="p-account">
    <div class="ph"><i>03</i><h2 data-t="One account"></h2></div>
    <p class="lede" data-t="Pick an account from any list, or type its id above. The map shows the money around it: who paid it on the left, who it paid on the right. Every arrow points the way the money moved."></p>
    <div class="explore">
      <div class="mapwrap">
        <div class="mapbar"><div class="what" id="what-a"></div>
          <div class="seg" id="view-a"><button data-v="near" aria-pressed="true" data-t="Around this account"></button><button data-v="all" aria-pressed="false" data-t="Whole network"></button></div></div>
        <canvas class="map" id="cv-a"></canvas>
        <div class="mapnote" id="note-a"></div>
        <div class="legend" id="legend-a"></div>
      </div>
      <div class="panel" id="panel-a"></div>
    </div>
  </section>
  <section class="page" id="p-structures">
    <div class="ph"><i>04</i><h2 data-t="Structures"></h2></div>
    <p class="lede" id="lede-f"></p>
    <div class="explore" style="grid-template-columns:22rem minmax(0,1fr) 24rem">
      <div class="list" id="list-f"></div>
      <div class="mapwrap">
        <div class="mapbar"><div class="what" id="what-f"></div></div>
        <canvas class="map" id="cv-f"></canvas>
        <div class="legend" id="legend-f"></div>
      </div>
      <div class="panel" id="panel-f"></div>
    </div>
  </section>
  <section class="page" id="p-replay">
    <div class="ph"><i>05</i><h2 data-t="Replay the month"></h2></div>
    <p class="lede" data-t="July 2026, one day at a time, on the same hop layout: known clients on the left, four hops to the right. Watch which days carry the bursts and how far the money travels in a day."></p>
    <div class="module" id="mod-replay"></div>
  </section>
  <section class="page" id="p-echoes">
    <div class="ph"><i>06</i><h2 data-t="Amount echoes"></h2></div>
    <p class="lede" data-t="An exact sum arrives at an account and leaves again as the same sum, or split into parts, within a day. Or one account sends the identical amount to several receivers on the same day. Each is a hypothesis for an analyst to check against what the transfers were said to be for."></p>
    <div class="module" id="mod-echoes"></div>
  </section>
  <section class="page" id="p-limits"></section>
</main>

<script type="module">
import { t, LANG, LOCALE, setLang, ROLE_DEF, KIND_DEF, roleName, kindName } from "./i18n.js";

/* Nothing on this page is fetched from anywhere but the run's own output. */
let D;
try {
  D = await (await fetch("../out/graph.json")).json();
} catch (err) {
  document.body.innerHTML = `<div class="boot">${t("The run output could not be read. This screen expects out/graph.json beside it, served over HTTP rather than opened from disk. Start it with: python3 run.py --serve")}</div>`;
  throw err;
}
const replayMod = await import("./replay.js").catch(() => null);
const echoesMod = await import("./echoes.js").catch(() => null);

/* ------------------------------ helpers ------------------------------ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = k => getComputedStyle(document.documentElement).getPropertyValue("--" + k).trim();
const fmt = n => Number(n).toLocaleString(LOCALE, { maximumFractionDigits: 0 });
const kzt = n => fmt(n) + " KZT";
const rgbOf = h => { const v = h.replace("#", ""); return [0, 2, 4].map(i => parseInt(v.slice(i, i + 2), 16) || 0); };
const soft = (h, a) => { const c = rgbOf(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
const plural = (n, one, many) => `${fmt(n)} ${t(n === 1 ? one : many)}`;
const roleCol = r => css(r) || css("steel");
const pill = r => `<span class="pill" style="background:${soft(roleCol(r), .1)};color:${roleCol(r)}">${esc(roleName(r))}</span>`;
const short = g => "…" + String(g).slice(-7);
const dateWord = d => { const x = new Date(d + "T00:00:00"); return isNaN(x) ? d : x.toLocaleDateString(LOCALE, { day: "numeric", month: "long" }); };
const sub = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? "");

/* Static labels marked in the markup. */
document.documentElement.lang = LANG;
document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
$("q").placeholder = t("find an account by id");

const incoming = new Map(), outgoing = new Map();
for (const e of D.edges) {
  if (!incoming.has(e.t)) incoming.set(e.t, []); incoming.get(e.t).push(e);
  if (!outgoing.has(e.s)) outgoing.set(e.s, []); outgoing.get(e.s).push(e);
}

const RANK = new Map(TOP.map(r => [String(r.gid), r]));

const FORM_BY_ID = new Map(FORMS.map(f => [String(f.formation_id), f]));
const MEMBERS = new Map(), FORMS_OF = new Map();
for (const r of (D.formation_members || [])) {
  const f = String(r.formation_id), g = String(r.gid);

  if (!FORMS_OF.has(g)) FORMS_OF.set(g, []); FORMS_OF.get(g).push(f);
}
const KNOW = new Map((D.node_completeness || []).map(r => [String(r.gid), r]));

const atEdge = n => n.hop === maxHop && n.outDeg === 0;

/* ------------------------------ rail ------------------------------ */
const NAV = [["start", "Start", "the case in one screen"], ["review", "Who to review first", "ranked, with reasons"], ["account", "One account", "its money, its role, its neighbours"],
  ["structures", "Structures", "funnels, chains, loops, fan-outs"], ["replay", "Replay the month", "July, day by day"], ["echoes", "Amount echoes", "same sum in, same sum out"], ["limits", "Where the data runs out", "and what to ask for next"]];

/* ------------------------------ the map, as a factory ------------------------------ */
function createMap(canvas, opts) {
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, hovered = null;
  const DPR = Math.min(devicePixelRatio || 1, 2);
  const pos = new Map(); let drawnEdges = [], hidden = 0;
  const M = { focus: null, view: "near", breakId: null, pos, layoutInfo: null };
  const radius = n => n.seed ? 5 : 2.6 + Math.min(4, Math.log10(1 + n.inKzt + n.outKzt) * .65);
  const CAP = 28;
  const hopLabel = h => h === 0 ? t("known clients") : sub(t("hop {n}"), { n: h });

  function spread(ids, x, top, bottom) {
    const gap = (bottom - top) / (ids.length + 1);
    ids.forEach((id, i) => pos.set(id, { x, y: top + gap * (i + 1), r: radius(byId.get(id)) }));
  }
  function layoutNear(n) {
    pos.clear(); hidden = 0;
    const id = String(n.id);
    const byKzt = (es, key) => es.slice().sort((a, b) => b.kzt - a.kzt).map(e => e[key]);
    const take = ids => { const u = [...new Set(ids)].filter(x => x !== id); if (u.length > CAP) { hidden += u.length - CAP; return u.slice(0, CAP); } return u; };
    const in1 = take(byKzt(incoming.get(id) || [], "s"));
    const both = (outgoing.get(id) || []).filter(e => in1.includes(e.t)).length;
    const out1 = take(byKzt(outgoing.get(id) || [], "t").filter(x => !in1.includes(x)));
    const seen = new Set([id, ...in1, ...out1]);
    const ring = (ids, map, key) => { const r = []; for (const p of ids) for (const e of byKzt(map.get(p) || [], key)) if (!seen.has(e)) { seen.add(e); r.push(e); } return take(r); };
    const in2 = ring(in1, incoming, "s"), out2 = ring(out1, outgoing, "t");
    const cols = [in2, in1, [id], out1, out2], padL = W < 480 ? 34 : 70, padR = W < 480 ? 34 : 70, top = 40, bottom = H - 30, step = (W - padL - padR) / 4;
    cols.forEach((ids, i) => spread(ids, padL + step * i, top, bottom));
    const set = new Set(pos.keys()); drawnEdges = D.edges.filter(e => set.has(e.s) && set.has(e.t));
    return { in1: in1.length, out1: out1.length, both };
  }
  function layoutForm(f) {
    pos.clear(); hidden = 0;
    const mem = [...(MEMBERS.get(String(f.formation_id)) || [])].filter(g => byId.has(g));
    const hops = [...new Set(mem.map(g => byId.get(g).hop))].sort((a, b) => a - b);
    const padL = 70, padR = 70, top = 40, bottom = H - 30, step = hops.length > 1 ? (W - padL - padR) / (hops.length - 1) : 0;
    hops.forEach((h, i) => spread(mem.filter(g => byId.get(g).hop === h).sort((a, b) => byId.get(b).outKzt - byId.get(a).outKzt), hops.length > 1 ? padL + step * i : W / 2, top, bottom));
    const set = new Set(pos.keys()); drawnEdges = D.edges.filter(e => set.has(e.s) && set.has(e.t));
    return hops;
  }
  function layoutAll() {
    pos.clear(); hidden = 0;
    const padL = W < 480 ? 40 : 88, padR = W < 480 ? 36 : 80, top = 34, bottom = H - 24;
    for (const n of D.nodes) {
      const jig = ((+String(n.id).slice(-4) % 997) / 997 - .5), band = Math.min(62, (W - padL - padR) / (maxHop + 1) * .55);
      pos.set(String(n.id), { x: padL + (W - padL - padR) * (n.hop / maxHop) + jig * band, y: top + (bottom - top) * n.y, r: radius(n) });
    }
    drawnEdges = D.edges;
  }
  function highlight() {
    const f = M.focus; if (!f) return { nodes: new Set(), edges: new Set() };
    if (f.type === "form") { const nodes = new Set(MEMBERS.get(String(f.f.formation_id)) || []); if (M.breakId) nodes.add(M.breakId); return { nodes, edges: new Set(D.edges.filter(e => nodes.has(e.s) && nodes.has(e.t))) }; }
    const id = String(f.n.id), nodes = new Set([id]), edges = new Set();
    for (const e of incoming.get(id) || []) { nodes.add(e.s); edges.add(e); }
    for (const e of outgoing.get(id) || []) { nodes.add(e.t); edges.add(e); }
    return { nodes, edges };
  }
  function arrow(a, b, col) {
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, tx = b.x - ux * (b.r + 2), ty = b.y - uy * (b.r + 2);
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx - ux * 7 - uy * 3.4, ty - uy * 7 + ux * 3.4); ctx.lineTo(tx - ux * 7 + uy * 3.4, ty - uy * 7 - ux * 3.4); ctx.closePath(); ctx.fill();
  }
  function draw() {
    ctx.clearRect(0, 0, W, H); ctx.font = "13px " + css("body"); ctx.textAlign = "center";
    const hl = highlight(), all = M.view === "all";
    const narrow = W < 480, allPadL = narrow ? 40 : 88, allPadR = narrow ? 36 : 80, nearPad = narrow ? 34 : 70;
    const hopText = h => narrow ? String(h) : hopLabel(h);
    const labelY = (i, base) => narrow ? (i % 2 ? 30 : 14) : base;
    if (narrow) ctx.font = "11px " + css("body");
    if (all) for (let h = 0; h <= maxHop; h++) {
      const x = allPadL + (W - allPadL - allPadR) * (h / maxHop);
      ctx.strokeStyle = css("grid"); ctx.beginPath(); ctx.moveTo(x, 26); ctx.lineTo(x, H - 24); ctx.stroke();
      ctx.fillStyle = css("grid-label"); ctx.fillText(hopText(h), x, labelY(h, 18));
    } else if (M.focus?.type === "node") {
      (W < 900 ? ["2 hops in", "paid it", "this one", "paid by it", "2 hops out"] : ["paid the payers", "paid this account", "this account", "were paid by it", "were paid next"])
        .forEach((s, i) => { ctx.fillStyle = css("grid-label"); ctx.fillText(t(s), nearPad + (W - nearPad * 2) / 4 * i, labelY(i, 22)); });
    } else if (M.focus?.type === "form" && M.layoutInfo) {
      M.layoutInfo.forEach((h, i, arr) => { ctx.fillStyle = css("grid-label"); ctx.fillText(hopText(h), arr.length > 1 ? 70 + (W - 140) / (arr.length - 1) * i : W / 2, labelY(i, 22)); });
    }
    if (narrow) ctx.font = "13px " + css("body");
    const dim = hl.nodes.size > 0;
    for (const e of drawnEdges) {
      const a = pos.get(e.s), b = pos.get(e.t); if (!a || !b) continue;
      const on = hl.edges.has(e);
      ctx.strokeStyle = on ? css("edge-on") : (dim && all ? css("edge-dim") : css("edge"));
      ctx.lineWidth = all ? (on ? 1.6 : .7) : Math.max(.8, Math.min(6, Math.log10(1 + e.kzt) - 3)) * (on ? 1.2 : 1);
      ctx.beginPath(); const mx = (a.x + b.x) / 2; ctx.moveTo(a.x, a.y); ctx.bezierCurveTo(mx, a.y, mx, b.y, b.x, b.y); ctx.stroke();
      if (!all || on) arrow(a, b, on ? css("arrow") : css("edge"));
    }
    for (const [id, p] of pos) {
      const n = byId.get(id), on = !dim || hl.nodes.has(id) || !all;
      ctx.globalAlpha = on ? 1 : .18; ctx.fillStyle = roleCol(n.role);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
      if (n.seed) { ctx.strokeStyle = css("ring"); ctx.lineWidth = 1; ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
    const sel = M.focus?.type === "node" ? pos.get(String(M.focus.n.id)) : null;
    if (sel) { ctx.strokeStyle = css("ring"); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sel.x, sel.y, sel.r + 6, 0, 6.2832); ctx.stroke(); }
    const bp = M.breakId ? pos.get(M.breakId) : null;
    if (bp) { ctx.strokeStyle = css("amber"); ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(bp.x, bp.y, bp.r + 8, 0, 6.2832); ctx.stroke();
      ctx.fillStyle = css("amber"); ctx.textAlign = "left"; ctx.font = "600 13px " + css("body"); ctx.fillText(t("breaking point"), bp.x + bp.r + 14, bp.y + 4); }
    ctx.textAlign = "left"; ctx.font = "12px " + css("mono");
    const small = !all && pos.size <= 40;
    for (const [id, p] of pos) {
      const isF = sel && id === String(M.focus.n.id);
      if (!(isF || small || hovered === id)) continue;
      ctx.fillStyle = isF || hovered === id ? css("fg") : css("muted");
      ctx.fillText(isF || hovered === id ? `${id} · ${roleName(byId.get(id).role)}` : short(id), p.x + p.r + 5, p.y + 4);
    }
  }
  function relayout() {
    if (M.view === "all") { layoutAll(); M.layoutInfo = null; opts.onLayout?.({ mode: "all", hidden }); }
    else if (M.focus?.type === "form") { M.layoutInfo = layoutForm(M.focus.f); opts.onLayout?.({ mode: "form", hops: M.layoutInfo, count: pos.size }); }
    else if (M.focus?.type === "node") { M.layoutInfo = null; opts.onLayout?.({ mode: "near", hidden, ...layoutNear(M.focus.n) }); }
    else { pos.clear(); drawnEdges = []; }
  }
  function resize() {
    const r = canvas.getBoundingClientRect(); if (!r.width) return;
    W = r.width; H = r.height; canvas.width = W * DPR; canvas.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    relayout(); draw();
  }
  new ResizeObserver(resize).observe(canvas);
  const pick = (mx, my) => { let best = null, bd = 110; for (const [id, p] of pos) { const d = (p.x - mx) ** 2 + (p.y - my) ** 2; if (d < bd) { bd = d; best = id; } } return best; };
  canvas.addEventListener("mousemove", e => { const r = canvas.getBoundingClientRect(), h = pick(e.clientX - r.left, e.clientY - r.top); if (h !== hovered) { hovered = h; canvas.style.cursor = h ? "pointer" : "default"; draw(); } });
  canvas.addEventListener("mouseleave", () => { hovered = null; draw(); });
  canvas.addEventListener("click", () => { if (hovered) api.selectNode(hovered); });
  M.update = () => { relayout(); draw(); };
  return M;
}

const legendHtml = (D.meta.roleOrder || []).filter(r => D.meta.roleCounts[r])

const mapA = createMap($("cv-a"), { onLayout: info => {
  const n = mapA.focus?.n;
  if (info.mode === "all") { $("what-a").innerHTML = `${sub(t("All {n} accounts"), { n: fmt(D.nodes.length) })} <span>· ${t("left to right is distance from the known clients · the selection and its transfers are lit")}</span>`; $("note-a").textContent = ""; }
  else if (n) {
    $("what-a").innerHTML = `${sub(t("Around {id}"), { id: esc(n.id) })} <span>· ${sub(t("paid by {a}, paid {b}"), { a: info.in1, b: info.out1 + info.both })}${info.both ? ` (${sub(t("{n} of them also paid it, drawn once on the left with arrows both ways"), { n: info.both })})` : ""}</span>`;
    $("note-a").textContent = info.hidden ? sub(t("{n} accounts with the smallest transfers are not drawn so the rest stay readable. Whole network shows everything."), { n: fmt(info.hidden) }) : "";
  }
}});
$("view-a").addEventListener("click", e => { const b = e.target.closest("button[data-v]"); if (!b) return; mapA.view = b.dataset.v; document.querySelectorAll("#view-a button").forEach(x => x.setAttribute("aria-pressed", x === b)); mapA.update(); });

function renderAccount(n) {
  const id = String(n.id), k = KNOW.get(id), rk = RANK.get(id);
  const forms = (FORMS_OF.get(id) || []).map(f => FORM_BY_ID.get(f)).filter(Boolean).sort((a, b) => a.rank - b.rank);
  $("panel-a").innerHTML = `
    <div class="k">${t("This account")}</div><div class="gid">${esc(id)}</div>${n.seed ? `<div style="margin-top:.3rem"><span class="pill" style="color:var(--amber)">${t("known client")}</span></div>` : ""}
    <p class="sentence">${sub(t("Received <b>{in}</b> from {a} and sent <b>{out}</b> to {b} in July."), { in: kzt(n.inKzt), a: plural(n.inDeg, "account", "accounts"), out: kzt(n.outKzt), b: plural(n.outDeg, "account", "accounts") })}</p>
    <div class="k">${t("Assessed as")}</div>
    <div>${pill(n.role)} <span style="color:var(--muted);font-size:.85rem;margin-left:.3rem">${t("rule confidence")} ${n.roleScore.toFixed(2)}</span></div>
    <p class="sentence">${esc(ROLE_DEF[n.role] || "")}</p>
    <div class="ev">${t("The rule fired on:")} <code>${esc(n.evidence)}</code></div>
    ${atEdge(n) ? `<div class="caveat">${sub(t("This account sits at hop {n} with nothing recorded going out. The crawl stopped here, so whether the money stopped here is not something this data can say."), { n: maxHop })}</div>` : ""}
    <div class="k">${t("Investigation priority")}</div>
    <div class="prio"><b>${(n.priority ?? 0).toFixed(3)}</b><span>${rk ? `#${rk.rank} ${t("of")} ${fmt(D.nodes.length)}` : sub(t("not in the top {n}"), { n: TOP.length })} · ${t("0 to 1, higher first")}</span></div>
    <div class="k">${t("Position")}</div>
    <div class="stat"><span>${t("hops from a known client")}</span><b>${n.hop}${n.seed ? ` (${t("known")})` : ""}</b></div>
    <div class="stat"><span>${t("group")}</span><b>${n.cluster}</b></div>
    ${k ? `<div class="k">${t("What we know of it")}</div><div class="stat"><span>${esc(t(String(k.knowledge_state)))}</span><b>${t("confidence")} ${(+k.confidence).toFixed(2)}</b></div><p class="empty" style="margin:.2rem 0 0">${esc(k.limitation || "")}</p>` : ""}
    <div class="k">${t("Structures it belongs to")}</div>
    ${forms.length ? forms.slice(0, 8).map(f => `<a class="chip" href="#structures/${esc(f.rank)}">#${esc(f.rank)} ${esc(kindName(f.kind))}</a>`).join("") + (forms.length > 8 ? `<span class="empty"> ${sub(t("and {n} more"), { n: forms.length - 8 })}</span>` : "") : `<p class="empty">${t("None. It is not part of any funnel, chain, loop, fan-out or bridge.")}</p>`}`;
}
function showAccount(id) {
  const n = byId.get(String(id).trim());
  if (!n) { $("panel-a").innerHTML = `<p class="empty">${sub(t("No account with the id {id} in this extract."), { id: esc(id) })}</p>`; mapA.focus = null; mapA.update(); return; }
  $("q").value = n.id; mapA.focus = { type: "node", n }; mapA.breakId = null; renderAccount(n); mapA.update();
}

/* ------------------------------ 07 limits ------------------------------ */
{
  const cs = D.completeness_summary || {}, g = D.integrity || {}, pct = v => (v * 100).toFixed(0) + "%";
  const tiles = [
    [fmt(g.dead_ends_truncated_depth4 ?? 0), sub(t("accounts at hop {n} with nothing going out. The crawl stopped, not the money."), { n: maxHop })],
    [fmt(g.dead_ends_genuine ?? 0), t("dead ends the crawl did follow to their end")],
    [fmt(g.seeds_absent_from_edges ?? 0), sub(t("of the {n} known clients appear in no transfer at all"), { n: fmt(g.seeds ?? D.meta.seeds) })],
    [fmt(g.seeds_without_outgoing ?? 0), t("known clients sent nothing in the window")],
    cs.state_node_share_truncated_at_depth != null ? [pct(cs.state_node_share_truncated_at_depth), t("of accounts sit at the crawl boundary")] : null,
    cs.state_turnover_share_truncated_at_depth != null ? [pct(cs.state_turnover_share_truncated_at_depth), t("of turnover ends at the crawl boundary")] : null,
    cs.state_count_isolated != null ? [fmt(cs.state_count_isolated), t("isolated accounts, no transfer either way")] : null,
  ].filter(Boolean);
  const nd = (D.next_data_request || []).slice().sort((a, b) => a.rank - b.rank), dem = D.demoted || [], res = D.resilience || [];
  $("p-limits").innerHTML = `
    <div class="ph"><i>07</i><h2>${t("Where the data runs out")}</h2></div>
    <p class="lede">${sub(t("The crawl followed money <b>outwards</b> from the {n} known clients for four hops. Money arriving into them was never followed, so anyone directing them from above is outside this extract by construction. These are the measured limits, and what to ask for next."), { n: fmt(D.meta.seeds) })}</p>
    <div class="tiles">${tiles.map(([v, l]) => `<div class="tile"><b>${v}</b><span>${esc(l)}</span></div>`).join("")}</div>
    <div class="cols">
      <div><h3>${t("What to ask the data owner for next")}</h3><p class="note">${t("Ranked by what each request would resolve.")}</p>
        ${nd.length ? nd.map(r => `<div class="ask"><div class="h"><i>${esc(r.rank)}</i>${esc(r.request)}</div><div class="w">${esc(r.why)}</div><div class="f"><b>${fmt(r.resolves_nodes)}</b> ${t("accounts resolved")} · <b>${kzt(r.illuminates_kzt)}</b> ${t("lit up")}</div></div>`).join("") : `<p class="empty">${t("Not generated in this run.")}</p>`}
      </div>
      <div><h3>${t("Where a plain centrality ranking would mislead")}</h3><p class="note">${t("Centrality promotes accounts that flow passes through. It cannot tell an account collecting from many payers apart from a business paying many suppliers. These accounts moved most between the two rankings.")}</p>
        ${dem.length ? `<table><thead><tr><th>${t("account")}</th><th class="right">${t("by centrality")}</th><th class="right">${t("by evidence")}</th><th>${t("assessed as")}</th><th>${t("the numbers")}</th></tr></thead><tbody>${dem.map(r => `<tr data-gid="${esc(r.gid)}"><td class="mono">${esc(short(r.gid))}</td><td class="right num">#${esc(r.rank_pagerank)}</td><td class="right num">#${esc(r.rank_priority)}</td><td>${pill(r.role)}</td><td class="wrap">${esc(r.evidence)}</td></tr>`).join("")}</tbody></table>` : `<p class="empty">${t("Not generated in this run.")}</p>`}
        <h3 style="margin-top:1.4rem">${t("If the top-ranked accounts were removed")}</h3><p class="note">${t("A ranking is only worth having if acting on it changes the network.")}</p>
        ${res.length ? `<table><thead><tr><th class="right">${t("removed")}</th><th class="right">${t("largest group left")}</th><th class="right">${t("separate pieces")}</th><th class="right">${t("still reachable from known clients")}</th></tr></thead><tbody>${res.map(r => `<tr><td class="right num">${fmt(r.removed)}</td><td class="right num">${fmt(r.largest_component)}</td><td class="right num">${fmt(r.n_components)}</td><td class="right num">${fmt(r.nodes_reachable_from_seeds)}</td></tr>`).join("")}</tbody></table>` : `<p class="empty">${t("Not generated in this run.")}</p>`}
      </div>
    </div>`;
}

/* ------------------------------ 05, 06 modules ------------------------------ */
let replayFacts = null, echoFacts = null;
if (replayMod?.mountReplay) { try { replayMod.mountReplay($("mod-replay"), D, api); replayFacts = replayMod.replayFacts?.(D) ?? null; } catch (e) { console.error(e); $("mod-replay").innerHTML = `<p class="empty">${t("This section could not start:")} ${esc(e.message)}</p>`; } }
else $("mod-replay").innerHTML = `<p class="empty">${t("This section's module is not present in this build.")}</p>`;
if (echoesMod?.mountEchoes) { try { echoesMod.mountEchoes($("mod-echoes"), D, api); echoFacts = echoesMod.echoFacts?.(D) ?? null; } catch (e) { console.error(e); $("mod-echoes").innerHTML = `<p class="empty">${t("This section could not start:")} ${esc(e.message)}</p>`; } }
else $("mod-echoes").innerHTML = `<p class="empty">${t("This section's module is not present in this build.")}</p>`;

/* ------------------------------ 01 start ------------------------------ */
{
  const g = D.integrity || {}, lead = TOP.slice(0, 3), forms = FORMS.slice(0, 3);
  $("p-start").innerHTML = `
    <div class="ph"><i>01</i><h2>${t("The case in one screen")}</h2></div>
    <p class="lede">${sub(t("Law enforcement named <b>{n} accounts</b> at the bottom of a chain. A crawl followed their outbound transfers for four hops through July 2026. This tool reads what the crawl brought back and answers one question: <b>which of these accounts should an analyst look at first, and why.</b>"), { n: D.meta.seeds })}</p>
    <div class="ledger">
      <div><b>${fmt(D.meta.seeds)}</b><span>${t("known clients, where the crawl began")}</span></div>
      <div><b>${fmt(D.meta.nodes)}</b><span>${t("accounts reached in four hops")}</span></div>
      <div><b>${fmt(D.meta.edges)}</b><span>${t("transfer relationships")}, ${kzt(D.meta.turnover)}</span></div>
      <div class="amber"><b>${fmt(TOP.length)}</b><span>${t("accounts to review first")}</span></div>
      <div><b>${fmt(FORMS.length)}</b><span>${t("structures that only make sense read together")}</span></div>
      <div><b>${fmt(abstained)}</b><span>${t("accounts not judged, because the data does not support a judgement")}</span></div>
    </div>
    <div class="grid2">
      <div>
        <h3 class="sec">${t("Start with these accounts")}</h3>
        ${lead.map(r => `<a class="lead" href="#account/${esc(r.gid)}" style="margin-bottom:.6rem"><div class="r">${t("RANK")} ${esc(r.rank)} · ${t("PRIORITY")} ${(+r.priority_score).toFixed(3)}</div><div class="g">${esc(r.gid)}</div><div class="t">${pill(r.role)}</div><div class="w">${esc(reasonOf(r))}</div></a>`).join("")}
        <a class="go" href="#review">${sub(t("All {n} ranked accounts"), { n: TOP.length })}</a>
      </div>
      <div>
        <h3 class="sec">${t("Start with these structures")}</h3>
        ${forms.map(f => `<a class="lead" href="#structures/${esc(f.rank)}" style="margin-bottom:.6rem"><div class="r">${t("RANK")} ${esc(f.rank)} · ${esc(kindName(f.kind).toUpperCase())}</div><div class="g">${plural(f.n_members, "account", "accounts")} · ${kzt(f.kzt_through)}</div><div class="w">${esc(f.hypothesis || KIND_DEF[f.kind] || "")}</div></a>`).join("")}
        <a class="go" href="#structures">${sub(t("All {n} structures"), { n: FORMS.length })}</a>
        <hr class="rule">
        <h3 class="sec">${t("Also in this file")}</h3>
        ${replayFacts?.busiestDay ? `<div class="fact"><b>${esc(dateWord(replayFacts.busiestDay.date))}</b><span>${sub(t("the busiest day: {kzt} in {n} transfers."), { kzt: kzt(replayFacts.busiestDay.kzt), n: fmt(replayFacts.busiestDay.n_tx) })} <a class="go" href="#replay">${t("Replay the month")}</a></span></div>` : ""}
        ${echoFacts ? `<div class="fact"><b>${fmt(echoFacts.total)}</b><span>${t("amount echoes: the same sum in and out within a day, or the same sum to several receivers.")} <a class="go" href="#echoes">${t("See them")}</a></span></div>` : ""}
        <div class="fact"><b>${fmt(g.dead_ends_truncated_depth4 ?? 0)}</b><span>${t("accounts where the crawl stopped rather than the money.")} <a class="go" href="#limits">${t("Where the data runs out")}</a></span></div>
      </div>
    </div>`;
}

/* ------------------------------ routing ------------------------------ */
const PAGES = ["start", "review", "account", "structures", "replay", "echoes", "limits"];
function go(page, arg) { location.hash = "#" + page + (arg ? "/" + arg : ""); }
function route() {
  const [page, arg] = location.hash.replace(/^#/, "").split("/");
  const p = PAGES.includes(page) ? page : "start";
  PAGES.forEach(x => $("p-" + x).toggleAttribute("data-on", x === p));
  document.querySelectorAll("#rail a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + p));
  if (p === "account") showAccount(arg || mapA.focus?.n?.id || TOP[0]?.gid);
  if (p === "structures") showForm(arg ? FORMS.find(f => String(f.rank) === arg) : (mapF.focus?.f || FORMS[0]));
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
document.addEventListener("click", e => { const tr = e.target.closest("tr[data-gid]"); if (tr) go("account", tr.dataset.gid); });
$("q").addEventListener("input", e => { const v = e.target.value.trim(); if (v.length === 18) go("account", v); });
$("q").addEventListener("change", e => { const v = e.target.value.trim(); if (v) go("account", v); });
renderFormList();
route();
</script>
</html>
