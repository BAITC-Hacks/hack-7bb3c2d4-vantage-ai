<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Money Graph · HackAlem</title>
<style>
/* ------------------------------------------------------------------ *
 * HackAlem palette. Every colour on this page is a token declared here.
 * Amber is reserved for the one thing that matters most on a view.
 * No green anywhere. Green belongs to Astana Hub, not to HackAlem.
 * ------------------------------------------------------------------ */
:root{
  --bg:#060B16; --panel:#0B1524; --sunk:#050912; --line:#16243A; --line-soft:#0F1B2C;
  --fg:#EEF3FB; --muted:#8FA3BF; --primary:#00C8FF; --secondary:#009AF0; --amber:#FFB020;
  --display:Manrope,Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;

  --consolidator:#FF5C6C; --coordinator:#C77DFF; --transit:#00C8FF; --distributor:#009AF0;
  --terminal:#7A8AA8; --peripheral:#4A5B75;
  --abstained_boundary:#6B5FA6; --abstained_single_observation:#443C6E;
  --steel:#5A6B87;

  --grid:rgba(0,200,255,.10); --grid-label:#7C90AD;
  --edge:rgba(122,138,168,.22); --edge-dim:rgba(122,138,168,.06); --edge-on:rgba(0,200,255,.85);
  --arrow:rgba(0,200,255,.90); --ring:#EEF3FB; --row-hover:rgba(0,200,255,.07);
  --dot-edge:rgba(238,243,251,.28);
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;font:1rem/1.5 var(--body);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ------------------------------ header ------------------------------ */
header{display:flex;align-items:center;gap:1.2rem;padding:.7rem 1.2rem;border-bottom:1px solid var(--line);
       background:var(--panel);flex-wrap:wrap}
.mark{display:flex;align-items:baseline}
.mark b,.mark i{font:700 1.2rem/1 var(--display);font-style:normal}
.mark i{color:var(--primary)}
.title{padding-left:1rem;border-left:1px solid var(--line)}
.title h1{font:600 1.05rem/1.2 var(--display);margin:0}
.title p{margin:0;color:var(--muted);font-size:.875rem}
.strip{display:flex;gap:.2rem;align-items:center;margin-left:auto;flex-wrap:wrap}
.strip .s{padding:.2rem .7rem;text-align:center}
.strip .s b{display:block;font:700 1.25rem/1.15 var(--display);font-variant-numeric:tabular-nums}
.strip .s span{font-size:.75rem;color:var(--muted);white-space:nowrap}
.strip .s.amber b{color:var(--amber)}
.strip .arrow{color:var(--steel);font-size:1.1rem}
.btn{padding:.5rem .8rem;border:1px solid var(--line);border-radius:8px;font-weight:600;font-size:.875rem;
     color:var(--fg);background:var(--sunk)}
.btn:hover{border-color:var(--primary)}
.btn[aria-pressed=true]{background:var(--primary);color:var(--bg);border-color:var(--primary)}

/* ------------------------------ layout ------------------------------ */
main{display:grid;grid-template-columns:22rem minmax(0,1fr) 24rem;height:calc(100vh - 4.6rem);min-height:0}
.left,.right{overflow:auto;min-height:0;background:var(--panel)}
.left{border-right:1px solid var(--line);display:flex;flex-direction:column}
.right{border-left:1px solid var(--line);padding:1rem 1.1rem 2rem}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
#cv{flex:1;display:block;width:100%;min-height:24rem;background:var(--bg);cursor:default}
.mapbar{display:flex;align-items:center;gap:.5rem;padding:.55rem .9rem;border-bottom:1px solid var(--line);
        background:var(--panel);flex-wrap:wrap}
.mapbar .what{font-weight:600;font-size:.9375rem;flex:1;min-width:12rem}
.mapbar .what span{color:var(--muted);font-weight:400}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:.2rem}
.seg button{padding:.3rem .7rem;font-size:.875rem;font-weight:600;color:var(--muted);border-radius:6px}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:.25rem .5rem;padding:.45rem .9rem;border-top:1px solid var(--line);
        background:var(--panel);font-size:.8rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:.3rem;cursor:help;padding:.05rem .3rem;border-radius:4px}
.legend span:hover{background:var(--row-hover);color:var(--fg)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;box-shadow:inset 0 0 0 1px var(--dot-edge)}
.mapnote{position:absolute;left:.9rem;bottom:3rem;font-size:.8rem;color:var(--muted);pointer-events:none;
         max-width:28rem;line-height:1.4}

/* ------------------------------ left pane --------------------------- */
.search{padding:.9rem 1rem .6rem}
.search label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.35rem}
input{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--fg);
      font:1rem/1.2 var(--body);font-variant-numeric:tabular-nums}
input:focus{outline:none;border-color:var(--primary)}
input::placeholder{color:var(--steel)}
.tabs{display:flex;gap:.2rem;padding:0 1rem;border-bottom:1px solid var(--line)}
.tab{padding:.5rem .7rem;font-size:.9375rem;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--primary)}
.list{overflow:auto;flex:1;min-height:0}
.list .intro{padding:.6rem 1rem .3rem;font-size:.8rem;color:var(--muted);line-height:1.45}
.row{display:grid;grid-template-columns:2rem 1fr;gap:.2rem .5rem;padding:.55rem 1rem;border-bottom:1px solid var(--line-soft);cursor:pointer}
.row:hover{background:var(--row-hover)}
.row[aria-selected=true]{background:var(--row-hover);box-shadow:inset 3px 0 0 var(--amber)}
.row .n{font:700 .9375rem/1.3 var(--display);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.row .h{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;font-size:.9375rem;font-weight:600;font-variant-numeric:tabular-nums}
.row .w{grid-column:2;font-size:.8125rem;color:var(--muted);line-height:1.4}
.pill{display:inline-block;padding:.08rem .5rem;border-radius:999px;font-size:.78rem;font-weight:650}

/* ------------------------------ right pane -------------------------- */
.k{color:var(--muted);font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.09em;margin:1rem 0 .3rem}
.k:first-child{margin-top:0}
.gid{font:700 1.15rem/1.3 var(--display);font-variant-numeric:tabular-nums;word-break:break-all}
.sentence{font-size:.9375rem;line-height:1.55}
.sentence b{font-variant-numeric:tabular-nums}
.ev{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;font-size:.85rem;color:var(--muted);line-height:1.45;margin-top:.4rem}
.ev code{color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem}
.stat{display:flex;justify-content:space-between;gap:.75rem;font-size:.9rem;padding:.2rem 0;color:var(--muted)}
.stat b{font-variant-numeric:tabular-nums;font-weight:650;color:var(--fg);text-align:right}
.prio{display:flex;align-items:baseline;gap:.6rem}
.prio b{font:700 1.9rem/1 var(--display);color:var(--amber);font-variant-numeric:tabular-nums}
.prio span{font-size:.875rem;color:var(--muted)}
.caveat{border-left:3px solid var(--amber);padding:.4rem .7rem;font-size:.875rem;color:var(--muted);line-height:1.45;margin-top:.6rem;background:var(--sunk);border-radius:0 8px 8px 0}
.chip{display:inline-block;margin:.2rem .3rem .2rem 0;padding:.25rem .6rem;border:1px solid var(--line);border-radius:8px;font-size:.8125rem;cursor:pointer}
.chip:hover{border-color:var(--primary)}
.empty{color:var(--muted);font-size:.9rem;line-height:1.5}

/* ------------------------------ overlay ----------------------------- */
#gaps{display:none;position:fixed;inset:4.6rem 0 0 0;background:var(--bg);overflow:auto;padding:1.2rem 1.6rem 3rem;z-index:5}
#gaps[data-on]{display:block}
#gaps h2{font:700 1.4rem/1.2 var(--display);margin:0 0 .3rem}
#gaps .lede{color:var(--muted);max-width:72ch;line-height:1.5;margin:0 0 1rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.6rem;margin-bottom:1.4rem}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:.6rem .75rem}
.tile b{display:block;font:650 1.35rem/1.2 var(--display);font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:.85rem;color:var(--muted);line-height:1.35;margin-top:.15rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(24rem,1fr));gap:1.4rem}
.cols h3{font:650 1.05rem/1.3 var(--display);margin:0 0 .3rem}
.cols .note{color:var(--muted);font-size:.9rem;line-height:1.5;margin:0 0 .6rem;max-width:60ch}
.ask{border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:9px;padding:.55rem .75rem;margin-bottom:.5rem;background:var(--panel)}
.ask .h{font-weight:650;font-size:.9375rem;display:flex;gap:.5rem}
.ask .h i{font-style:normal;color:var(--primary)}
.ask .w{font-size:.875rem;color:var(--muted);line-height:1.45;margin-top:.25rem}
.ask .f{font-size:.875rem;color:var(--muted);margin-top:.3rem}
.ask .f b{color:var(--fg);font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:.4rem .55rem;border-bottom:1px solid var(--line-soft);white-space:nowrap;vertical-align:top}
td.wrap{white-space:normal;color:var(--muted);line-height:1.4}
th{color:var(--muted);font-weight:650;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
tbody tr[data-gid]:hover td{background:var(--row-hover);cursor:pointer}
.num{font-variant-numeric:tabular-nums;text-align:right}
.boot{padding:3rem;font-size:1rem;color:var(--muted);line-height:1.6}

@media (max-width:1180px){
  main{grid-template-columns:20rem minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;height:auto;min-height:calc(100vh - 4.6rem)}
  .left{grid-row:1/3}
  .stage{min-height:34rem}
  .right{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:800px){
  main{display:block}
  .left{max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}
  .stage{min-height:28rem}
  .strip{margin-left:0}
}
</style>

<header>
  <span class="mark"><b>Hack</b><i>Alem</i></span>
  <div class="title">
    <h1>Money Graph</h1>
    <p>Which of these accounts should an analyst look at first, and why.</p>
  </div>
  <div class="strip" id="strip"></div>
  <button class="btn" id="gapsBtn" aria-pressed="false">Where the data runs out</button>
</header>

<main>
  <aside class="left">
    <div class="search">
      <label for="q">Find an account</label>
      <input id="q" list="ids" placeholder="type an account id" autocomplete="off" spellcheck="false" inputmode="numeric">
      <datalist id="ids"></datalist>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-t="acc" aria-selected="true">Accounts to review</button>
      <button class="tab" role="tab" data-t="frm" aria-selected="false">Structures</button>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <div class="stage">
    <div class="mapbar">
      <div class="what" id="what"></div>
      <div class="seg" id="view">
        <button data-v="near" aria-pressed="true">Around this account</button>
        <button data-v="all" aria-pressed="false">Whole network</button>
      </div>
    </div>
    <canvas id="cv"></canvas>
    <div class="mapnote" id="mapnote"></div>
    <div class="legend" id="legend"></div>
  </div>

  <aside class="right" id="panel"></aside>
</main>

<div id="gaps"></div>

<script type="module">
/* Nothing on this page is fetched from anywhere but the run's own output. */
let D;
try {
  D = await (await fetch("../out/graph.json")).json();
} catch (err) {
  document.body.innerHTML =
    `<div class="boot">The run output could not be read. This screen expects <code>out/graph.json</code>
     beside it, served over HTTP rather than opened from disk. Start it with <code>python3 run.py --serve</code>.</div>`;
  throw err;
}

/* ------------------------------ helpers ------------------------------ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = k => getComputedStyle(document.documentElement).getPropertyValue("--" + k).trim();
const fmt = n => Number(n).toLocaleString("en-GB", { maximumFractionDigits: 0 });
const kzt = n => fmt(n) + " KZT";
const rgbOf = h => { const v = h.replace("#", ""); return [0, 2, 4].map(i => parseInt(v.slice(i, i + 2), 16) || 0); };
const soft = (h, a) => { const c = rgbOf(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
const plural = (n, one, many) => `${fmt(n)} ${n === 1 ? one : many}`;
const AMBER = css("amber");
const roleCol = r => css(r) || css("steel");
const pill = r => `<span class="pill" style="background:${soft(roleCol(r), .18)};color:${roleCol(r)}">${esc(String(r).replace(/_/g, " "))}</span>`;

/* Plain definitions. The thresholds are the ones in src/moneygraph/roles.py. */
const ROLE_DEF = {
  consolidator: "Paid by 8 or more different accounts and keeps most of it, passing on less than half.",
  coordinator: "Receives from 4 or more accounts and pays 4 or more. Money moves through it in both directions.",
  transit: "Passes on roughly what it receives, between 80% and 120%.",
  distributor: "Pays out to 20 or more receivers.",
  terminal: "Money arrives and nothing leaves, and it sits before the crawl's edge, so the money appears to stay.",
  peripheral: "No rule threshold met: low activity, or a known client with only outbound transfers recorded.",
  abstained_boundary: "Sits at hop 4 with nothing going out. The crawl stopped here, so no judgement is made.",
  abstained_single_observation: "Fewer than three transfers in total. Too little to judge.",
};
const KIND_DEF = {
  funnel: "several accounts each send most of their outflow to one collection point",
  chain: "money forwarded account to account, each passing on most of what arrived",
  reciprocal_loop: "money sent and sent back, a pair or a short cycle",
  fan_out: "one account paying many receivers that send nothing on",
  bridge: "one account that part of a group depends on to reach the rest of the network",
};
const kindName = k => String(k ?? "").replace(/_/g, " ");

/* Ids are 18 digits and exceed Number.MAX_SAFE_INTEGER, so every key is a String. */
const byId = new Map(D.nodes.map(n => [String(n.id), n]));
const incoming = new Map(), outgoing = new Map();
for (const e of D.edges) {
  if (!incoming.has(e.t)) incoming.set(e.t, []); incoming.get(e.t).push(e);
  if (!outgoing.has(e.s)) outgoing.set(e.s, []); outgoing.get(e.s).push(e);
}
const TOP = (D.top || []).slice().sort((a, b) => a.rank - b.rank);
const RANK = new Map(TOP.map(r => [String(r.gid), r]));
const FORMS = (D.formations || []).slice().sort((a, b) => (a.rank ?? 1e9) - (b.rank ?? 1e9));
const FORM_BY_ID = new Map(FORMS.map(f => [String(f.formation_id), f]));
const MEMBERS = new Map(), FORMS_OF = new Map();
for (const r of (D.formation_members || [])) {
  const f = String(r.formation_id), g = String(r.gid);
  if (!MEMBERS.has(f)) MEMBERS.set(f, new Set()); MEMBERS.get(f).add(g);
  if (!FORMS_OF.has(g)) FORMS_OF.set(g, []); FORMS_OF.get(g).push(f);
}
const KNOW = new Map((D.node_completeness || []).map(r => [String(r.gid), r]));
const maxHop = Math.max(...D.nodes.map(n => n.hop));
const atEdge = n => n.hop === maxHop && n.outDeg === 0;
const abstained = D.nodes.filter(n => n.role.startsWith("abstained")).length;

/* ------------------------------ header ------------------------------ */
$("strip").innerHTML = [
  [D.meta.seeds, "known clients", ""],
  [D.meta.nodes, "accounts reached", ""],
  [TOP.length, "to review first", "amber"],
  [FORMS.length, "structures found", ""],
  [abstained, "not judged", ""],
].map(([v, l, c], i) => `${i ? '<span class="arrow">→</span>' : ""}<div class="s ${c}"><b>${fmt(v)}</b><span>${l}</span></div>`).join("");

$("ids").innerHTML = D.nodes.map(n => `<option value="${n.id}">`).join("");

/* ------------------------------ state ------------------------------ */
let view = "near";                // "near" or "all"
let focus = null;                 // {type:"node", n} or {type:"form", f}
let hovered = null;
const pos = new Map();            // id -> {x,y,r} for the nodes currently drawn
let drawnEdges = [];              // edges among drawn nodes
let hidden = 0;                   // nodes not drawn because a ring was capped
let breakId = null;

/* ------------------------------ layouts ------------------------------ */
const cv = $("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0;
const DPR = Math.min(devicePixelRatio || 1, 2);
const radius = n => n.seed ? 5 : 2.6 + Math.min(4, Math.log10(1 + n.inKzt + n.outKzt) * .65);
const CAP = 28;                   // most nodes drawn per ring around an account

function spread(ids, x, top, bottom) {
  const gap = (bottom - top) / (ids.length + 1);
  ids.forEach((id, i) => { const n = byId.get(id); pos.set(id, { x, y: top + gap * (i + 1), r: radius(n) }); });
}

function layoutNear(n) {
  pos.clear(); hidden = 0;
  const id = String(n.id);
  const byKzt = (es, key) => es.slice().sort((a, b) => b.kzt - a.kzt).map(e => e[key]);
  const take = ids => { const u = [...new Set(ids)].filter(x => x !== id); if (u.length > CAP) { hidden += u.length - CAP; return u.slice(0, CAP); } return u; };
  const in1 = take(byKzt(incoming.get(id) || [], "s"));
  // An account that both paid and was paid by this one is drawn once, on the payer side,
  // with arrows both ways, rather than twice or only on the right.
  const out1 = take(byKzt(outgoing.get(id) || [], "t").filter(t => !in1.includes(t)));
  const seen = new Set([id, ...in1, ...out1]);
  const ring = (ids, map, key) => {
    const r = [];
    for (const p of ids) for (const e of byKzt(map.get(p) || [], key)) if (!seen.has(e)) { seen.add(e); r.push(e); }
    return take(r);
  };
  const in2 = ring(in1, incoming, "s"), out2 = ring(out1, outgoing, "t");
  const cols = [in2, in1, [id], out1, out2];
  const padL = 70, padR = 70, top = 40, bottom = H - 30;
  const step = (W - padL - padR) / 4;
  cols.forEach((ids, i) => spread(ids, padL + step * i, top, bottom));
  const set = new Set(pos.keys());
  drawnEdges = D.edges.filter(e => set.has(e.s) && set.has(e.t));
  return { in1: in1.length, out1: out1.length, in2: in2.length, out2: out2.length };
}

function layoutForm(f) {
  pos.clear(); hidden = 0;
  const mem = [...(MEMBERS.get(String(f.formation_id)) || [])].filter(g => byId.has(g));
  const hops = [...new Set(mem.map(g => byId.get(g).hop))].sort((a, b) => a - b);
  const padL = 70, padR = 70, top = 40, bottom = H - 30;
  const step = hops.length > 1 ? (W - padL - padR) / (hops.length - 1) : 0;
  hops.forEach((h, i) => spread(mem.filter(g => byId.get(g).hop === h).sort((a, b) => byId.get(b).outKzt - byId.get(a).outKzt),
    hops.length > 1 ? padL + step * i : W / 2, top, bottom));
  const set = new Set(pos.keys());
  drawnEdges = D.edges.filter(e => set.has(e.s) && set.has(e.t));
  return hops;
}

function layoutAll() {
  pos.clear(); hidden = 0;
  const padL = 88, padR = 80, top = 34, bottom = H - 24;
  for (const n of D.nodes) {
    const jig = ((+String(n.id).slice(-4) % 997) / 997 - .5);
    const band = Math.min(62, (W - padL - padR) / (maxHop + 1) * .55);
    pos.set(String(n.id), { x: padL + (W - padL - padR) * (n.hop / maxHop) + jig * band, y: top + (bottom - top) * n.y, r: radius(n) });
  }
  drawnEdges = D.edges;
}

/* ------------------------------ drawing ------------------------------ */
function highlightSet() {
  if (!focus) return { nodes: new Set(), edges: new Set() };
  if (focus.type === "form") {
    const nodes = new Set(MEMBERS.get(String(focus.f.formation_id)) || []);
    if (breakId) nodes.add(breakId);
    return { nodes, edges: new Set(D.edges.filter(e => nodes.has(e.s) && nodes.has(e.t))) };
  }
  const id = String(focus.n.id), nodes = new Set([id]), edges = new Set();
  for (const e of incoming.get(id) || []) { nodes.add(e.s); edges.add(e); }
  for (const e of outgoing.get(id) || []) { nodes.add(e.t); edges.add(e); }
  return { nodes, edges };
}

function arrow(a, b, col) {
  const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1;
  const ux = dx / L, uy = dy / L, tx = b.x - ux * (b.r + 2), ty = b.y - uy * (b.r + 2);
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(tx, ty);
  ctx.lineTo(tx - ux * 7 - uy * 3.4, ty - uy * 7 + ux * 3.4);
  ctx.lineTo(tx - ux * 7 + uy * 3.4, ty - uy * 7 - ux * 3.4);
  ctx.closePath(); ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.font = "13px " + css("body"); ctx.textAlign = "center";
  const hl = highlightSet();
  const all = view === "all";
  if (all) {
    for (let h = 0; h <= maxHop; h++) {
      const x = 88 + (W - 168) * (h / maxHop);
      ctx.strokeStyle = css("grid"); ctx.beginPath(); ctx.moveTo(x, 26); ctx.lineTo(x, H - 24); ctx.stroke();
      ctx.fillStyle = css("grid-label"); ctx.fillText(h === 0 ? "known clients" : "hop " + h, x, 18);
    }
  } else if (focus?.type === "node") {
    const labels = ["paid the payers", "paid this account", "this account", "were paid by it", "were paid next"];
    labels.forEach((t, i) => { ctx.fillStyle = css("grid-label"); ctx.fillText(t, 70 + (W - 140) / 4 * i, 22); });
  }
  const dim = hl.nodes.size > 0;
  for (const e of drawnEdges) {
    const a = pos.get(e.s), b = pos.get(e.t); if (!a || !b) continue;
    const on = hl.edges.has(e);
    ctx.strokeStyle = on ? css("edge-on") : (dim && all ? css("edge-dim") : css("edge"));
    ctx.lineWidth = all ? (on ? 1.6 : .7) : Math.max(.8, Math.min(6, Math.log10(1 + e.kzt) - 3)) * (on ? 1.2 : 1);
    ctx.beginPath(); const mx = (a.x + b.x) / 2;
    ctx.moveTo(a.x, a.y); ctx.bezierCurveTo(mx, a.y, mx, b.y, b.x, b.y); ctx.stroke();
    if (!all || on) arrow(a, b, on ? css("arrow") : css("edge"));
  }
  for (const [id, p] of pos) {
    const n = byId.get(id);
    const on = !dim || hl.nodes.has(id) || !all;
    ctx.globalAlpha = on ? 1 : .18;
    ctx.fillStyle = roleCol(n.role);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    if (n.seed) { ctx.strokeStyle = css("ring"); ctx.lineWidth = 1; ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  const sel = focus?.type === "node" ? pos.get(String(focus.n.id)) : null;
  if (sel) { ctx.strokeStyle = css("ring"); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sel.x, sel.y, sel.r + 6, 0, 6.2832); ctx.stroke(); }
  const bp = breakId ? pos.get(breakId) : null;
  if (bp) {
    ctx.strokeStyle = AMBER; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(bp.x, bp.y, bp.r + 8, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = AMBER; ctx.textAlign = "left"; ctx.font = "600 13px " + css("display");
    ctx.fillText("breaking point", bp.x + bp.r + 14, bp.y + 4);
  }
  /* Labels: the focus always, the rest of a small view, and whatever is hovered. */
  ctx.textAlign = "left"; ctx.font = "12px " + css("body");
  const small = !all && pos.size <= 40;
  for (const [id, p] of pos) {
    const isF = sel && id === String(focus.n.id);
    if (!(isF || small || hovered === id)) continue;
    ctx.fillStyle = isF || hovered === id ? css("fg") : css("muted");
    const n = byId.get(id);
    ctx.fillText(isF || hovered === id ? `${id} · ${n.role.replace(/_/g, " ")}` : "…" + id.slice(-7), p.x + p.r + 5, p.y + 4);
  }
}

function resize() {
  const r = cv.getBoundingClientRect(); W = r.width; H = r.height;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  relayout(); draw();
}
new ResizeObserver(resize).observe(cv);

function relayout() {
  const note = $("mapnote"), what = $("what");
  if (view === "all") {
    layoutAll();
    what.innerHTML = `All ${fmt(D.nodes.length)} accounts <span>· left to right is distance from the known clients · arrows point the way the money moved</span>`;
    note.textContent = focus ? "The selection and its direct transfers are lit; everything else is dimmed." : "";
  } else if (focus?.type === "form") {
    const hops = layoutForm(focus.f);
    what.innerHTML = `${esc(kindName(focus.f.kind))} #${esc(focus.f.rank)} <span>· ${plural(pos.size, "account", "accounts")} across ${plural(hops.length, "hop", "hops")} · ${esc(KIND_DEF[focus.f.kind] || "")}</span>`;
    note.textContent = "";
  } else if (focus?.type === "node") {
    const c = layoutNear(focus.n);
    what.innerHTML = `Around ${esc(focus.n.id)} <span>· paid by ${c.in1}, paid ${c.out1} · one more ring either side</span>`;
    note.textContent = hidden ? `${fmt(hidden)} accounts with the smallest transfers are not drawn so the rest stay readable. Switch to Whole network to see everything.` : "";
  } else { pos.clear(); drawnEdges = []; what.textContent = ""; note.textContent = ""; }
}

/* ------------------------------ legend ------------------------------ */
$("legend").innerHTML = (D.meta.roleOrder || []).filter(r => D.meta.roleCounts[r])
  .map(r => `<span title="${esc(ROLE_DEF[r] || "")}"><i class="dot" style="background:${roleCol(r)}"></i>${esc(r.replace(/_/g, " "))} ${fmt(D.meta.roleCounts[r])}</span>`).join("")
  + `<span title="An account law enforcement already named"><i class="dot" style="background:transparent;box-shadow:0 0 0 1.5px var(--ring)"></i>known client</span>`;

/* ------------------------------ left list ------------------------------ */
let tab = "acc";
function renderList() {
  const el = $("list");
  if (tab === "acc") {
    el.innerHTML = `<div class="intro">Ranked on evidence, not on how central an account is. The reason is the rule that fired and the numbers it fired on.</div>` +
      TOP.map(r => `<div class="row" data-gid="${esc(r.gid)}" aria-selected="${focus?.type === "node" && String(focus.n.id) === String(r.gid)}">
        <div class="n">${esc(r.rank)}</div><div class="h">…${esc(String(r.gid).slice(-7))} ${pill(r.role)}</div>
        <div class="w">${esc(reasonOf(r))}</div></div>`).join("");
  } else {
    el.innerHTML = `<div class="intro">Groups of accounts that only make sense read together. Each carries the one account whose removal breaks most of it.</div>` +
      FORMS.slice(0, 60).map((f, i) => `<div class="row" data-frm="${i}" aria-selected="${focus?.type === "form" && focus.f === f}">
        <div class="n">${esc(f.rank)}</div><div class="h">${esc(kindName(f.kind))} <span class="pill" style="background:var(--sunk);color:var(--muted)">${plural(f.n_members, "account", "accounts")}</span></div>
        <div class="w">${plural(f.n_seeds, "known client", "known clients")} · ${kzt(f.kzt_through)} through it</div></div>`).join("") +
      (FORMS.length > 60 ? `<div class="intro">${fmt(FORMS.length - 60)} more structures are in out/formations.csv.</div>` : "");
  }
}
/* The rule's own evidence string, with the leading role name removed when the ranking repeats it. */
const reasonOf = r => String(r.why || "").replace(/^[a-z_]+:\s*/, "");

/* ------------------------------ right panel ------------------------------ */
function renderNode(n) {
  const id = String(n.id), k = KNOW.get(id), rk = RANK.get(id);
  const forms = (FORMS_OF.get(id) || []).map(f => FORM_BY_ID.get(f)).filter(Boolean).sort((a, b) => a.rank - b.rank);
  $("panel").innerHTML = `
    <div class="k">This account</div><div class="gid">${esc(id)}${n.seed ? ` <span class="pill" style="background:var(--sunk);color:var(--muted)">known client</span>` : ""}</div>
    <p class="sentence">Received <b>${kzt(n.inKzt)}</b> from ${plural(n.inDeg, "account", "accounts")} and sent <b>${kzt(n.outKzt)}</b> to ${plural(n.outDeg, "account", "accounts")} in the window.</p>
    <div class="k">Assessed as</div>
    <div>${pill(n.role)} <span style="color:var(--muted);font-size:.85rem">rule confidence ${n.roleScore.toFixed(2)}</span></div>
    <p class="sentence" style="margin:.4rem 0 0">${esc(ROLE_DEF[n.role] || "")}</p>
    <div class="ev">The rule fired on: <code>${esc(n.evidence)}</code></div>
    ${atEdge(n) ? `<div class="caveat">This account sits at hop ${maxHop} with nothing recorded going out. The crawl stopped here, so whether the money stopped here is not something this data can say.</div>` : ""}
    <div class="k">Investigation priority</div>
    <div class="prio"><b>${(n.priority ?? 0).toFixed(3)}</b><span>${rk ? `#${rk.rank} of ${fmt(D.nodes.length)}` : `not in the top ${TOP.length}`} · 0 to 1, higher first</span></div>
    <div class="k">Position</div>
    <div class="stat"><span>hops from a known client</span><b>${n.hop}${n.seed ? " (known)" : ""}</b></div>
    <div class="stat"><span>group</span><b>${n.cluster}</b></div>
    ${k ? `<div class="k">What we know of it</div>
      <div class="stat"><span>${esc(String(k.knowledge_state).replace(/_/g, " "))}</span><b>confidence ${(+k.confidence).toFixed(2)}</b></div>
      <p class="empty" style="margin:.2rem 0 0">${esc(k.limitation || "")}</p>` : ""}
    <div class="k">Structures it belongs to</div>
    ${forms.length ? forms.slice(0, 8).map(f => `<span class="chip" data-frmid="${esc(f.formation_id)}">#${esc(f.rank)} ${esc(kindName(f.kind))}</span>`).join("") + (forms.length > 8 ? `<span class="empty"> and ${forms.length - 8} more</span>` : "")
                   : `<p class="empty">None. It is not part of any funnel, chain, loop, fan-out or bridge.</p>`}`;
}

function renderForm(f) {
  const bp = f.breaking_point_gid ? String(f.breaking_point_gid) : null;
  const unit = { articulation: "accounts cut off", dominator: "accounts cut off", flow: "KZT stopped" }[f.breaking_point_method] || "";
  const mem = MEMBERS.get(String(f.formation_id)) || new Set();
  $("panel").innerHTML = `
    <div class="k">This structure</div><div class="gid">${esc(kindName(f.kind))} #${esc(f.rank)} <span style="color:var(--muted);font-weight:400;font-size:.9rem">of ${FORMS.length}</span></div>
    <p class="sentence">${esc((KIND_DEF[f.kind] || "").replace(/^./, c => c.toUpperCase()))}. ${plural(f.n_members, "account", "accounts")}, ${plural(f.n_seeds, "of them a known client", "of them known clients")}, <b>${kzt(f.kzt_through)}</b> moving through it.</p>
    <div class="k">Breaking point</div>
    ${bp ? `<div class="gid" style="color:var(--amber);cursor:pointer" data-gid="${esc(bp)}">${esc(bp)}</div>
            <p class="empty" style="margin:.2rem 0 0">Remove this one account and ${esc(fmt(f.breaking_point_effect))} ${esc(unit)}. Found by ${esc(f.breaking_point_method)}. Marked in amber on the map.</p>`
         : `<p class="empty">Not identified for this structure.</p>`}
    ${f.hypothesis ? `<div class="k">Hypothesis to test</div><p class="sentence">${esc(f.hypothesis)}</p>` : ""}
    ${f.evidence ? `<div class="ev">Arithmetic behind it: <code>${esc(f.evidence)}</code></div>` : ""}
    <div class="k">Members</div>
    <div>${[...mem].slice(0, 30).map(g => `<span class="chip" data-gid="${esc(g)}" style="color:${roleCol(byId.get(g)?.role)}">…${esc(g.slice(-7))}</span>`).join("")}${mem.size > 30 ? `<span class="empty"> and ${mem.size - 30} more</span>` : ""}</div>`;
}

/* ------------------------------ selection ------------------------------ */
function selectNode(id, fromSearch) {
  const n = byId.get(String(id).trim());
  if (!n) { if (fromSearch) $("panel").innerHTML = `<p class="empty">No account with that id in this extract.</p>`; return; }
  focus = { type: "node", n }; breakId = null;
  if (!fromSearch) $("q").value = n.id;
  renderNode(n); renderList(); relayout(); draw();
}
function selectForm(f) {
  if (!f) return;
  focus = { type: "form", f }; breakId = f.breaking_point_gid ? String(f.breaking_point_gid) : null;
  $("q").value = "";
  renderForm(f); renderList(); relayout(); draw();
}

/* ------------------------------ where the data runs out ------------------------------ */
function renderGaps() {
  const cs = D.completeness_summary || {}, g = D.integrity || {};
  const pct = v => (v * 100).toFixed(0) + "%";
  const tiles = [
    [fmt(g.dead_ends_truncated_depth4 ?? 0), `accounts at hop ${maxHop} with nothing going out. The crawl stopped, not the money.`],
    [fmt(g.dead_ends_genuine ?? 0), "dead ends the crawl did follow to their end"],
    [fmt(g.seeds_absent_from_edges ?? 0), `of the ${fmt(g.seeds ?? D.meta.seeds)} known clients appear in no transfer at all`],
    [fmt(g.seeds_without_outgoing ?? 0), "known clients sent nothing in the window"],
    cs.state_node_share_truncated_at_depth != null ? [pct(cs.state_node_share_truncated_at_depth), "of accounts sit at the crawl boundary"] : null,
    cs.state_turnover_share_truncated_at_depth != null ? [pct(cs.state_turnover_share_truncated_at_depth), "of turnover ends at the crawl boundary"] : null,
    cs.state_count_isolated != null ? [fmt(cs.state_count_isolated), "isolated accounts, no transfer either way"] : null,
  ].filter(Boolean);
  const nd = (D.next_data_request || []).slice().sort((a, b) => a.rank - b.rank);
  const dem = D.demoted || [], res = D.resilience || [];
  $("gaps").innerHTML = `
    <h2>Where the data runs out</h2>
    <p class="lede">The crawl followed money <em>outwards</em> from the ${fmt(D.meta.seeds)} known clients for four hops. Money arriving into them was never followed, so anyone directing them from above is outside this extract by construction. These are the measured limits, and what to ask for next.</p>
    <div class="tiles">${tiles.map(([v, l]) => `<div class="tile"><b>${v}</b><span>${esc(l)}</span></div>`).join("")}</div>
    <div class="cols">
      <div><h3>What to ask the data owner for next</h3><p class="note">Ranked by what each request would resolve.</p>
        ${nd.length ? nd.map(r => `<div class="ask"><div class="h"><i>${esc(r.rank)}</i>${esc(r.request)}</div><div class="w">${esc(r.why)}</div>
          <div class="f"><b>${fmt(r.resolves_nodes)}</b> accounts resolved · <b>${kzt(r.illuminates_kzt)}</b> lit up</div></div>`).join("") : `<p class="empty">Not generated in this run.</p>`}
      </div>
      <div><h3>Where a plain centrality ranking would mislead</h3><p class="note">Centrality promotes accounts that flow passes through. It cannot tell an account collecting from many payers apart from a business paying many suppliers. These accounts moved most between the two rankings.</p>
        ${dem.length ? `<table><thead><tr><th>account</th><th class="num">by centrality</th><th class="num">by evidence</th><th>assessed as</th><th>the numbers</th></tr></thead><tbody>${
          dem.map(r => `<tr data-gid="${esc(r.gid)}"><td>…${esc(String(r.gid).slice(-7))}</td><td class="num">#${esc(r.rank_pagerank)}</td><td class="num">#${esc(r.rank_priority)}</td><td>${pill(r.role)}</td><td class="wrap">${esc(r.evidence)}</td></tr>`).join("")}</tbody></table>` : `<p class="empty">Not generated in this run.</p>`}
        <h3 style="margin-top:1.4rem">If the top-ranked accounts were removed</h3><p class="note">A ranking is only worth having if acting on it changes the network.</p>
        ${res.length ? `<table><thead><tr><th class="num">removed</th><th class="num">largest group left</th><th class="num">separate pieces</th><th class="num">still reachable from known clients</th></tr></thead><tbody>${
          res.map(r => `<tr><td class="num">${fmt(r.removed)}</td><td class="num">${fmt(r.largest_component)}</td><td class="num">${fmt(r.n_components)}</td><td class="num">${fmt(r.nodes_reachable_from_seeds)}</td></tr>`).join("")}</tbody></table>` : `<p class="empty">Not generated in this run.</p>`}
      </div>
    </div>`;
}
renderGaps();
$("gapsBtn").onclick = () => {
  const on = !$("gaps").hasAttribute("data-on");
  $("gaps").toggleAttribute("data-on", on); $("gapsBtn").setAttribute("aria-pressed", on);
  $("gapsBtn").textContent = on ? "Back to the map" : "Where the data runs out";
};

/* ------------------------------ interaction ------------------------------ */
function pick(mx, my) {
  let best = null, bd = 110;
  for (const [id, p] of pos) { const d = (p.x - mx) ** 2 + (p.y - my) ** 2; if (d < bd) { bd = d; best = id; } }
  return best;
}
cv.addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect(), h = pick(e.clientX - r.left, e.clientY - r.top);
  if (h !== hovered) { hovered = h; cv.style.cursor = h ? "pointer" : "default"; draw(); }
});
cv.addEventListener("mouseleave", () => { hovered = null; draw(); });
cv.addEventListener("click", () => { if (hovered) selectNode(hovered); });
$("q").addEventListener("input", e => { const v = e.target.value.trim(); if (v.length === 18) selectNode(v, true); });
$("q").addEventListener("change", e => { const v = e.target.value.trim(); if (v) selectNode(v, true); });
$("view").addEventListener("click", e => {
  const b = e.target.closest("button[data-v]"); if (!b) return;
  view = b.dataset.v;
  document.querySelectorAll("#view button").forEach(x => x.setAttribute("aria-pressed", x === b));
  relayout(); draw();
});
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  tab = t.dataset.t;
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
  renderList();
});
document.addEventListener("click", e => {
  const fr = e.target.closest("[data-frm]"); if (fr) { selectForm(FORMS[+fr.dataset.frm]); return; }
  const fi = e.target.closest("[data-frmid]"); if (fi) { selectForm(FORM_BY_ID.get(fi.dataset.frmid)); return; }
  const g = e.target.closest("[data-gid]");
  if (g && g.dataset.gid) {
    if ($("gaps").hasAttribute("data-on")) $("gapsBtn").click();
    selectNode(g.dataset.gid);
  }
});

/* The screen opens on an answer: the account ranked first. */
renderList();
if (TOP.length) selectNode(TOP[0].gid); else resize();
</script>
</html>
